# Render blueprint for the RepoBuddy API (server/). The website deploys separately to Cloudflare Pages.
services:
  - type: web
    name: repobuddy-api
    runtime: docker
    # Free: sleeps after 15 min idle and loses clones on sleep (the site re-maps automatically).
    # Once billing or credits are active, switch to `starter` and uncomment the disk and WORK_DIR below
    # so the service stays awake and clones survive restarts.
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
    # disk:
    #   name: repos
    #   mountPath: /data
    #   sizeGB: 5
    envVars:
      # - key: WORK_DIR
      #   value: /data
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
